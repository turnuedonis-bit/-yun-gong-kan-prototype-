le-tabs button{font-size:13px;padding:6px}.mobile-point{padding:11px;border:1px solid #bbb;font-size:13px}.mobile-point.selected{background:#e7e7e7;border-color:#555}.comparison{display:grid;grid-template-columns:1fr 1fr;border:1px solid #bbb}.comparison>div{padding:13px;font-size:13px}.comparison>div+div{border-left:1px solid #bbb}.scene-link{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;padding:12px}.status-box{border:1px solid #999;padding:12px;background:#eee;font-size:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:min(760px,90vw);background:#333;color:#fff;border:1px solid #555;padding:13px 19px;z-index:10;font-size:14px;display:none}.toast.show{display:block}.toast button{min-height:25px;padding:1px 7px;margin-left:12px;font-size:12px;background:#333;color:white;border-color:#aaa}.tool-banner{margin:12px 0 0;padding:8px 12px;border:1px solid #aaa;font-size:13px;background:#eee}.mobile-screen-label{font-size:12px;color:#666;text-align:center;margin-bottom:10px}.empty-map{width:100%;height:100%;display:grid;place-items:center;padding:35px;text-align:center;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 12px,#f2f2f2 12px,#f2f2f2 13px);border:1px dashed #ccc}.empty-map .stack{align-items:center;max-width:420px}.photo-preview{width:100%;height:100%;object-fit:contain}.mobile-photo{height:225px;border:1px solid #aaa;overflow:hidden;flex-shrink:0}.mobile-photo svg{height:100%;width:100%}.pending{font-size:13px;border-left:3px solid #aaa;padding:7px 10px;background:#f7f7f7}.mobile-main .data-table{font-size:12px}.mobile-main .data-table td,.mobile-main .data-table th{padding:8px 6px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.tool-shell{padding:14px 12px}.tool-title{gap:10px}.tool-title strong{font-size:16px}.tool-title .small{font-size:11px}.viewer{padding <body>
<div class="tool-shell" aria-label="原型查看工具">
 <div class="tool-title"><div><strong>云工勘 / 低保真交互原型</strong><p class="small">页面结构 · 功能关系 · 操作流程</p></div><div class="tool-tabs"><button data-action="mode" data-value="pc" id="mode-pc">PC 端 · 7 个页面</button><button data-action="mode" data-value="mobile" id="mode-mobile">移动端 · 4 个场景</button></div></div>
 <nav class="tool-index" id="page-index" aria-label="页面与场景索引" tabindex="-1"></nav>
 <div class="tool-options"><span id="dimensions"></span><label>演示状态：<select id="scenario" aria-label="演示状态"></select></label><button data-action="reset">重置本次演示</button><button data-action="help">打开方法与资料边界</button></div>
 <p class="tool-description">以上为原型查看工具。可直接切换页面检查；跳转不代表业务已完成。所有识别、推荐、覆盖、同步、清单生成与导出仅演示流程。</p>
 <div class="tool-banner" id="tool-banner" hidden></div>
</div>
<main class="viewer"><div id="screen-label" class="mobile-screen-label" hidden></div><div class="canvas-wrap" id="canvas-wrap"><section class="canvas pc" id="canvas" aria-label="当前原型画布"></section></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="local-file" class="visually-hidden" aria-label="选择本地文件用于预览">
<script>
/* 本文件仅演示 PRD V1.0 定义的流程。没有算法、服务器上传或文件导出。 */
const PC=['上传平面图与预览','设置比例尺','标注区域与墙体','AP 点位与型号确认','查看信号覆盖','生成设备清单','预览并导出方案'];
const SHORT=['上传与预览','比例尺','区域与墙体','AP 点位与型号','信号覆盖','设备清单','预览与导出'];
const MOBILE=['现场拍图上传','方案查看与演示','信号实测与热力图比对','施工点位与型号核对'];
const SOURCES=['P0-01 · PRD 第 12 页','P0-02 · PRD 第 13 页','P0-03 / 04 · PRD 第 14–15 页','P0-05 · PRD 第 16 页','P0-06 · PRD 第 17 页','P0-07 · PRD 第 18 页','P0-08 · PRD 第 18–19 页'];
const SCENARIOS=[['default','当前操作状态'],['ready','查看完整示意（真实数据待确认）']];
const PCERR=[['uploadFail','上传失败'],['missingSize','待补充尺寸'],['recognitionFail','墙体识别失败'],['missingModel','型号待补充'],['coverageFail','模拟失败'],['mismatch','清单对应需核对'],['exportFail','导出失败']];
const MERR=[[['photoFail','上传或同步失败']],[['loadFail','加载失败'],['loadPartial','内容未完整加载'],['noPlan','方案未生成']],[['measureMissing','采集信息不完整'],['measureFail','同步失败']],[['siteMismatch','现场位置或型号不一致']]];
const initial=()=>({mode:'pc',page:0,mobile:0,scenario:'default',upload:'未上传',filename:'待确认',format:'待确认',image:'',quality:false,scale:'未设置',scalePosition:false,size:'',sizeDemo:false,scaleChecked:false,region:false,wall:false,recognition:'待识别',wallSelected:false,wallShift:0,material:false,thickness:false,wallChecked:false,placing:false,adjusting:'',apState:'未布点',points:[],selected:'A',coverage:'未生成',coverChecked:false,list:'未生成',listChecked:false,review:[false,false,false,false],export:'待导出',exportFormat:'PDF',photo:'待上传',photoName:'待确认',photoImage:'',photoSelected:false,photoChecked:false,loaded:'未加载（演示入口）',mobileTab:'ap',measurePosition:false,measureState:'待确认',site:{},feedback:''});
let s=initial();
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,value='',cls='')=>`<button class="${cls}" data-action="${action}" data-value="${esc(value)}">${label}</button>`;
const notice=text=>`<div class="note">${text}</div>`;
const stateBox=text=>`<div class="status-box">${text} <span class="badge">演示</span></div>`;
const side=content=>`<aside class="side">${content}</aside>`;
const heading=(title,status)=>`<div class="row between"><h2>${title}</h2><span class="badge">${esc(status)}</span></div>`;
const checked=(id,text,value)=>`<label class="check"><input type="checkbox" data-check="${id}" ${value?'checked':''}>${text}</label>`;
const samplePoints=()=>[{id:'A',x:220,y:185,pos:false,model:false},{id:'B',x:585,y:315,pos:false,model:false}];
function currentPoints(){return s.points.length?s.points:samplePoints()}
function toast(msg){$('toast').innerHTML=esc(msg)+' '+btn('关闭','closeToast');$('toast').classList.add('show')}
function map({ap=false,heat=false,walls=false,scale=false,region=false,measure=false,interactive=false}={}){
 const pts=currentPoints();
 const heatLayer=heat?`<ellipse cx="240" cy="195" rx="165" ry="133" fill="#bdbdbd" opacity=".55"/><ellipse cx="577" cy="305" rx="168" ry="119" fill="#dedede" opacity=".75"/><ellipse cx="240" cy="195" rx="86" ry="70" fill="#909090" opacity=".4"/><ellipse cx="577" cy="305" rx="75" ry="63" fill="#a4a4a4" opacity=".4"/><rect x="610" y="75" width="108" height="60" fill="url(#hatch)" stroke="#777" stroke-dasharray="6 4"/><text x="624" y="101" font-size="13" fill="#333">薄弱区域示意</text><text x="624" y="120" font-size="11">判断口径待确认</text>`:'';
 return `<svg viewBox="0 0 800 460" role="img" aria-label="平面图占位示意${heat?'，叠加灰阶覆盖示意':''}" data-map="${interactive?'yes':'no'}"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eee" stroke-width="1"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#aaa" stroke-width="1"/></pattern></defs><rect width="800" height="460" fill="url(#grid)"/><path d="M75 60H730V400H75Z" stroke="#555" fill="white" stroke-width="5"/>${heatLayer}${region||s.region?'<rect x="88" y="75" width="270" height="145" fill="#e9e9e9" opacity=".6" stroke="#666" stroke-dasharray="7 4"/><text x="115" y="98" font-size="13">区域标注示意</text>':''}<g fill="none" stroke="#aaa" stroke-width="4"><path d="M370 60V190M370 240V400M75 240H245M290 240H370M370 220H545M590 220H730M530 220V330M530 365V400"/></g><g fill="#888" font-size="17"><text x="150" y="150">图纸区域 · 示意</text><text x="485" y="153">图纸区域 · 示意</text><text x="142" y="341">图纸区域 · 示意</text></g>${walls||s.wall?`<g class="map-hit" tabindex="0" role="button" aria-label="选择墙体示意" data-action="selectWall"><path d="M${370+s.wallShift} 60V400" stroke="#fff" stroke-width="19"/><path d="M${370+s.wallShift} 60V190M${370+s.wallShift} 240V400" stroke="${s.wallSelected?'#222':'#666'}" stroke-width="${s.wallSelected?9:6}" stroke-dasharray="${s.recognition==='待用户确认'?'8 3':''}"/><rect x="${355+s.wallShift}" y="115" width="30" height="285" fill="transparent"/></g>`:''}${scale||s.scalePosition?'<path d="M100 375H290M100 363V387M290 363V387" stroke="#333" stroke-width="2"/><text x="123" y="363" font-size="13">对应位置示意 · 实际长度待确认</text>':''}${ap?pts.map(p=>`<g class="map-hit" tabindex="0" role="button" aria-label="查看示意点位 ${p.id}" data-action="selectAP" data-value="${p.id}"><rect x="${p.x-58}" y="${p.y-24}" width="155" height="96" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="21" fill="${s.selected===p.id?'#333':'white'}" stroke="#333" stroke-width="2"/><text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="14" fill="${s.selected===p.id?'white':'#333'}">AP</text><rect x="${p.x-58}" y="${p.y+28}" width="155" height="42" fill="white" stroke="#888"/><text x="${p.x-49}" y="${p.y+45}" font-size="12">点位 ${p.id}（示意）</text><text x="${p.x-49}" y="${p.y+60}" font-size="11">对应型号：待确认</text></g>`).join(''):''}${measure?'<path d="M460 330h28m-14-14v28" stroke="#222" stroke-width="3"/><text x="486" y="338" font-size="12">实测位置示意</text>':''}<text x="75" y="436" font-size="12" fill="#777">平面图占位示意 · 非真实客户图纸 · 比例和业务数据待确认</text></svg>`;
}
function workspace(title,options={},tools='',caption='示意图仅用于检查结构和操作路径；不代表识别或计算结果。'){
 return `<div class="workspace"><div class="workspace-head"><h3>${title}</h3><div class="row">${tools}</div></div><div class="drawing-area">${map(options)}</div><div class="map-caption">${caption}</div>${options.heat?legend():''}</div>`;
}
function legend(){return '<div class="legend"><span><i class="swatch" style="background:#aaa"></i>覆盖范围示意</span><span><i class="swatch" style="background:#ddd"></i>覆盖范围示意</span><span>灰阶无信号等级含义；分级、阈值、颜色含义待确认</span></div>'}
function table(selectable=true){return `<table class="data-table"><thead><tr><th>关联点位</th><th>AP 型号</th><th>数量</th></tr></thead><tbody>${currentPoints().map(p=>`<tr class="${s.selected===p.id?'selected':''}" ${selectable?`data-action="selectAP" data-value="${p.id}"`:''}><td>${selectable?btn(`点位 ${p.id}（示意）`,'selectAP',p.id):`点位 ${p.id}（示意）`}</td><td>待确认</td><td>待确认</td></tr>`).join('')}</tbody></table>`}
function inputEvidence(){return `<div class="kv"><span>比例尺</span><span>${s.scaleChecked?'已演示检查':'待检查'}；实际尺寸待确认</span><span>墙体信息</span><span>材质、厚度待确认</span><span>衰减系数</span><span>系统匹配；数值待确认</span><span>AP 信息</span><span>点位示意；型号、数量待确认</span></div>`}
function pcBody(){switch(s.page){
 case 0:{const preview=s.upload==='上传完成';return `<div class="workspace"><div class="workspace-head"><h3>图纸预览</h3><span class="badge">${preview?'预览示意':'等待图纸'}</span></div><div class="drawing-area">${preview?(s.image?`<img class="photo-preview" src="${s.image}" alt="本地图片预览，未上传服务器">`:map()):`<div class="empty-map"><div class="stack"><h2>上传客户平面图</h2><p>CAD 工程文件、截图、现场图纸照片</p><p class="small">具体支持格式与大小上限待确认</p>${btn('使用示意图演示','sampleUpload','','primary')}${btn('选择本地文件预览','file','pc')}<p class="small">仅本地预览，不上传服务器或处理 CAD</p></div></div>`}</div><div class="map-caption">${s.image?'所选图片仅用于本地预览；未进行识别或格式支持验证。':'图纸占位示意，不代表真实业务图纸。'}</div></div>${side(`${heading('图纸信息',s.upload)}<div class="kv"><span>文件名称</span><span>${esc(s.filename)}</span><span>文件格式</span><span>${esc(s.format)}</span><span>大小限制</span><span>待确认</span></div><div class="row">${btn('更换图纸','sampleUpload')}${btn('选择本地文件','file','pc')}</div>${s.upload==='待上传'?btn('开始演示上传','uploadStart','','primary'):s.upload==='上传中'?`${stateBox('上传中 · 点击查看下一状态')}${btn('展示上传完成','uploadComplete','','primary')}`:''}${s.upload==='上传失败'?`${notice('上传失败（演示）。请检查或更换图纸；具体格式限制待确认。')}${btn('重新选择示意图','sampleUpload')}`:''}<div class="rule stack"><h3>检查图纸</h3><p class="small">确认主要区域与墙体可辨认，图纸完整、清晰。</p>${checked('quality','已演示检查图纸完整度与清晰度',s.quality)}${notice('图纸模糊、反光、标注不清或内容不完整时，应先补充或更换资料。')}</div>`)}`}
 case 1:return `${workspace('图纸与比例尺对应位置',{scale:s.scalePosition},btn('演示指定对应位置','scalePosition'))}${side(`${heading('比例尺设置',s.scale)}<label class="field">已知实际尺寸<input id="size-input" type="text" value="${esc(s.size)}" placeholder="提供可核实的实际长度"><span class="small">尺寸单位、数值范围待确认；不进行真实校准</span></label><div class="kv"><span>图纸对应位置</span><span>${s.scalePosition?'已指定（示意）':'待指定'}</span><span>比例尺结果</span><span>待确认</span></div>${btn('使用待确认占位演示','sizeDemo')}${btn('演示设置比例尺','scaleSet','','primary')}${checked('scaleChecked','已演示检查并确认设置结果',s.scaleChecked)}${notice('图纸缺少尺寸或实际长度无法核实时，需先补充资料。演示确认不表示实际比例尺已校准。')}${btn('返回更换图纸','goto','0')}`)}`;
 case 2:return `${workspace('区域与墙体标注',{walls:s.wall,region:s.region},`${btn('手动标注区域','drawRegion')}${btn('手动标注墙体','drawWall')}${btn('自动识别墙体','recognize')}`)}${side(`${heading('标注与识别',s.recognition)}${s.recognition==='识别中'?btn('展示识别结果','recognizeComplete','','primary'):''}<p class="small">点击图中墙体，检查位置与范围。所有标注、识别与修正均为示意。</p>${!s.wallSelected?btn('选择示意墙体','selectWall'):''}${s.wallSelected?`${btn('演示修正墙体位置','correctWall')}<label class="field">墙体材质<select id="material"><option value="">待确认 · 枚举未定义</option><option value="demo" ${s.material?'selected':''}>演示选择 · 具体材质待确认</option></select></label><label class="field">墙体厚度<select id="thickness"><option value="">待确认 · 单位与选项未定义</option><option value="demo" ${s.thickness?'selected':''}>演示选择 · 具体厚度待确认</option></select></label><div class="pending">信号衰减系数由系统按材质与厚度匹配，用户不手动填写。系数数值与匹配规则待确认。</div>`:''}${s.recognition==='识别失败'?notice('墙体识别失败（演示）。请检查图纸，或使用手动标注补充。'):''}${checked('wallChecked','已演示检查标注及墙体信息',s.wallChecked)}<p class="small">材质或厚度不确定应标“待确认”，提示其会影响覆盖模拟。</p>`)}`;
 case 3:{const pts=s.points;return `${workspace('AP 点位图',{ap:!!pts.length,interactive:true},`${btn('手动放置 AP','manualAP')}${btn('自动推荐点位','recommend')}`,s.placing?'点击图纸添加示意点位；未定义推荐算法和数量规则。':s.adjusting?'点击图纸调整当前示意点位位置。':'推荐与点位均为示意；点击 AP 查看对应信息。')}${side(`${heading('点位与型号',s.apState)}${s.apState==='推荐中'?btn('展示推荐结果','recommendComplete','','primary'):''}${!pts.length?notice('请选择手动放置或自动推荐。推荐结果需人工检查，不能直接作为最终方案。'):`<h3>① 逐项确认点位</h3><div class="ap-list">${pts.map(p=>`<div class="ap-item ${s.selected===p.id?'selected':''}"><div class="row between"><strong>点位 ${p.id}（示意）</strong><span class="small">${p.pos?'已演示确认':'待确认点位'}</span></div><div class="row">${btn('查看点位','selectAP',p.id)}${btn(p.pos?'重新查看确认':'演示确认点位','confirmPoint',p.id)}</div></div>`).join('')}</div><div class="rule stack"><h3>② 型号与数量 · ${esc(s.selected)}（示意）</h3><div class="kv"><span>对应型号</span><span>待确认</span><span>设备数量</span><span>待确认</span></div>${btn('演示确认型号与数量','confirmModel',s.selected,'primary')}${btn('调整当前点位位置','adjustAP',s.selected)}<p class="small">${pts.find(p=>p.id===s.selected)?.model?'已演示型号确认；真实型号与数量仍待确认。':'先逐项确认点位，再确认型号与数量。'}</p></div>`}${notice('推荐依据、算法和真实设备型号待确认。示意点位个数不代表推荐设备数量。')}`)}`}
 case 4:return `${workspace('信号覆盖效果',{ap:true,heat:s.coverage==='已生成'||s.coverage==='需调整'},btn('演示生成覆盖','coverageStart'),s.coverage==='未生成'?'尚未生成覆盖；AP 点位仅为示意。':'覆盖与薄弱区域均为示意，非真实计算或实测结果。')}${side(`${heading('覆盖模拟',s.coverage)}${s.coverage==='模拟中'?btn('展示覆盖示意','coverageComplete','','primary'):''}<h3>本次模拟的输入依据</h3>${inputEvidence()}${notice('信号分级、数值阈值、颜色含义及达标口径待确认。灰阶只用于占位，不表示信号等级。')}${s.coverage==='模拟失败'?notice('模拟失败（演示）。检查比例尺、墙体和 AP 确认信息。'):''}${checked('coverChecked','已演示查看覆盖并人工检查',s.coverChecked)}<div class="rule stack"><h3>发现覆盖不足？</h3>${btn('返回调整 AP 点位／型号','goto','3')}${btn('返回检查墙体信息','goto','2')}<p class="small">修改相关信息后，再重新查看覆盖示意；不自动判定达标。</p></div>`)}`;
 case 5:return `${workspace('清单对应的 AP 点位',{ap:true},'',`当前选中：点位 ${esc(s.selected)}（示意）。点击点位定位清单中的对应行。`)}<div class="list-panel"><div class="workspace-head"><h3>设备清单</h3><span class="badge">${s.list}</span></div><div class="box stack">${s.list==='未生成'?`${notice('依据已确认 AP 点位、型号与数量生成。未确认型号时，不生成完整清单。')}${btn('演示生成清单','listStart','','primary')}`:s.list==='生成中'?`${stateBox('生成中（演示）')}${btn('展示清单占位','listComplete','','primary')}`:`${table()}<p class="small">点击清单行或图上点位，查看对应高亮。型号与业务数量待确认。</p>${s.list==='信息待补充'?notice('存在未演示确认型号的点位，请返回 AP 环节补充。占位信息不是完整业务清单。'):''}${s.list==='待核对'?notice('对应关系需核对（异常演示）。返回 AP 页检查点位、型号和数量；未定义额外清单字段。'):''}${checked('listChecked','已演示核对点位与清单对应关系',s.listChecked)}${btn('返回核对点位与型号','goto','3')}${btn('按更新的确认信息重新生成','listStart')}`}<div class="pending">设备字段：型号、数量、关联点位编号。其他字段待确认；不含价格或采购流程。</div></div></div>`;
 case 6:return pcPreview();
}}
function pcPreview(){const labels=['平面图与比例尺','墙体及 AP 点位与型号','覆盖效果','设备清单与点位对应'];const targets=[1,3,4,5];return `<div class="preview"><div class="row between"><h2>方案预览 · 集中核对</h2><span class="badge">模板字段与版式待确认</span></div><div class="preview-grid"><div class="preview-card"><div class="workspace-head">平面图与 AP 点位／型号</div><div class="drawing-area">${map({ap:true,walls:true})}</div><div class="map-caption">点位示意；对应型号与数量待确认</div></div><div class="preview-card"><div class="workspace-head">信号覆盖效果</div><div class="drawing-area">${map({ap:true,heat:true})}</div><div class="map-caption">灰阶示意；分级、阈值与达标口径待确认</div></div><div class="preview-card"><div class="workspace-head">设备清单</div><div class="box">${table()}<p class="small">占位清单，不是真实设备生成结果。</p></div></div><div class="preview-card"><div class="workspace-head">方案输入依据</div><div class="box stack">${inputEvidence()}<p class="small">项目目标：将通常 5～7 天压缩至约 2 小时。尚非实际完成时长或效率承诺。</p></div></div></div></div>${side(`${heading('导出前检查',s.export)}<p class="small">供制作人本人或同事核对。发现不一致，返回对应环节修改后再检查。</p><div>${labels.map((x,i)=>`<div class="review-item">${checked('review'+i,x+'（演示核对）',s.review[i])}${btn('返回检查','goto',targets[i])}</div>`).join('')}</div><div class="row">${btn('检查原图','goto','0')}${btn('检查墙体','goto','2')}</div><label class="field">导出格式<select id="export-format"><option value="PDF" ${s.exportFormat==='PDF'?'selected':''}>PDF</option><option value="Word" ${s.exportFormat==='Word'?'selected':''}>Word</option></select></label>${btn('确认检查并演示导出','exportStart','','primary')}${s.export==='导出中'?btn('展示导出完成','exportComplete'):''}${s.export==='导出完成'?stateBox('导出完成 · 已演示；没有生成文件'):''}${s.export==='导出失败'?`${notice('导出失败（演示）。可重新选择格式，再次演示导出。')}${btn('再次演示导出','exportStart')}`:''}<div class="pending">检查确认仅用于演示。真实数据、模板字段及文件规格待确认；不生成 PDF／Word。</div>`)}`}
function mobileMap(title,opts={}){return `<div class="mobile-map"><div class="workspace-head">${title}<span class="badge">示意</span></div><div class="drawing-area">${map(opts)}</div><div class="map-caption">点位及图纸为示意；型号与真实数据待确认</div></div>`}
function mobileContent(){switch(s.mobile){
 case 0:return `<div class="row between"><h2>采集现场资料</h2><span class="badge">P0</span></div><p class="small">拍摄实地环境或纸质图纸，检查照片内容后上传。</p><div class="row">${btn('现场拍摄（演示）','takePhoto')}${btn('选择本地照片','file','mobile')}</div><div class="mobile-photo">${s.photoSelected?(s.photoImage?`<img class="photo-preview" src="${s.photoImage}" alt="所选本地照片预览，未上传服务器">`:map()):'<div class="placeholder" style="height:100%"><div><h3>照片预览区域</h3><p class="small">尚未拍摄或选图</p></div></div>'}</div><div class="kv"><span>图片信息</span><span>${esc(s.photoName)}</span><span>项目关联</span><span>待确认</span></div>${checked('photoChecked','已演示检查照片内容',s.photoChecked)}${stateBox('上传／同步状态：'+s.photo)}${s.photo==='上传中'?btn('展示上传完成','photoUploaded'):s.photo==='上传完成'?btn('演示同步到 PC','photoSync'):s.photo==='同步中'?btn('展示同步完成','photoSynced'):''}${s.photo==='同步完成'?notice('已演示同步完成，资料供 PC 端方案设计使用。未进行服务器上传或同步。'):''}${s.photo==='上传或同步失败'?`${notice('上传或同步失败（演示）。请检查网络或照片，重试入口如下。')}${btn('重试上传','photoUpload')}`:''}<div class="pending">具体图片字段、关联方式、断点续传及离线暂存规则待确认。</div>`;
 case 1:{const loaded=s.loaded==='已加载';return `<div class="row between"><h2>现场查看方案</h2><span class="badge">P0</span></div>${stateBox('方案状态：'+s.loaded)}${s.loaded==='加载中'?btn('展示加载完成','loadComplete','','primary'):s.loaded!=='已加载'?btn('演示打开已生成方案','loadStart','','primary'):''}${!loaded?`${notice(s.loaded==='未加载（演示入口）'?'打开后查看 AP 点位图、覆盖图与设备清单。':'方案未生成、加载失败或内容不完整时，暂不能作为完整方案展示。')}<div class="placeholder" style="min-height:190px">方案内容待加载（演示）</div>`:`<div class="mobile-tabs">${btn('AP 点位','mobileTab','ap',s.mobileTab==='ap'?'active':'')}${btn('覆盖效果','mobileTab','heat',s.mobileTab==='heat'?'active':'')}${btn('设备清单','mobileTab','list',s.mobileTab==='list'?'active':'')}</div>${s.mobileTab==='list'?`<div class="box stack">${table()}<p class="small">型号、数量待确认；占位清单用于对应查看。</p></div>`:mobileMap(s.mobileTab==='heat'?'信号覆盖效果':'AP 点位图',{ap:true,heat:s.mobileTab==='heat'})}${s.mobileTab==='heat'?notice('覆盖为灰阶示意，非实测结果。分级、阈值和颜色含义待确认。'):`<div class="mobile-point">当前示意点位：${esc(s.selected)}<br>对应型号：待确认；设备数量：待确认</div>`}`}<div class="rule stack"><h3>P1 可选现场协同</h3>${btn('信号实测与热力图比对 →','scene','2','scene-link')}${btn('施工点位与型号核对 →','scene','3','scene-link')}<p class="small">可独立查看或跳过。移动端不进行精细标注或复杂布点。</p></div><div class="pending">弱网查看范围、加载细节待确认。</div>`}
 case 2:return `<div class="row between"><h2>实测与方案对照</h2><span class="badge">P1 可选</span></div>${mobileMap('实测位置与热力图区域',{ap:true,heat:true,measure:s.measurePosition})}${btn('演示对应实测位置','measurePosition')}<div class="comparison"><div><strong>现场实测</strong><p>测量位置：${s.measurePosition?'已演示对应':'待对应'}</p><p>信号字段／数值：待确认</p></div><div><strong>方案覆盖</strong><p>图纸区域：示意</p><p>预测数值与分级：待确认</p></div></div>${stateBox('比对／同步：'+s.measureState)}${s.measureState==='采集信息不完整'?notice('采集信息不完整（演示）。请补充采集后再比对。'):s.measureState==='同步失败'?`${notice('同步失败（演示）。请检查位置与信息，再次同步。')}${btn('演示重新同步','measureSync')}`:''}${s.measureState==='同步中'?btn('展示同步结果','measureComplete'):''}${s.feedback==='measure'?notice('已演示记录差异供 PC 检查。实际反馈方式待确认；未发送消息或创建任务。'):''}<div class="pending">仅呈现比对流程；实测字段、数值单位、差异阈值和判断等级待确认，不读取手机信号或自动判定合格。</div>`;
 case 3:return `<div class="row between"><h2>按方案逐项核对</h2><span class="badge">P1 可选</span></div>${mobileMap('方案 AP 点位图',{ap:true})}<div class="row">${currentPoints().map(p=>btn('示意点位 '+p.id,'selectAP',p.id,s.selected===p.id?'active':'')).join('')}</div><div class="box stack"><div class="kv"><span>方案点位</span><span>${esc(s.selected)}（示意）</span><span>对应型号</span><span>待确认</span><span>设备数量</span><span>待确认</span><span>核对状态</span><span>${esc(s.site[s.selected]||'待确认')}</span></div><p class="small">对照现场安装位置、产品型号及数量；未确认项不能显示已核对。</p>${btn('演示核对当前点位','siteConfirm',s.selected)}${btn('演示发现不一致','siteMismatch',s.selected)}</div>${s.site[s.selected]==='不一致（演示）'?notice('现场位置、型号或数量与方案不一致（演示）。请检查对应关系并反馈方案制作人；不将此项标为已核对。'):''}${s.feedback==='site'?notice('已演示反馈供 PC 检查点位与型号，必要时重新生成清单与方案。具体处理方式待确认。'):''}<div class="pending">核对字段、详细状态、点选／扫码方式及规则待确认；不模拟真实扫码验证或新增派单流程。</div>`;
}}
function mobileFooter(){switch(s.mobile){case 0:return `<div class="row">${btn('确认并演示上传','photoUpload','','primary')}${btn('查看 PC 资料入口','toPC','0')}</div><span class="small">照片确认后上传；真实资料仍待确认</span>`;case 1:return `<div class="row">${btn('结束查看，返回场景入口','sceneIndex','','primary')}</div><span class="small">查看与演示，不编辑方案</span>`;case 2:return `<div class="row">${btn('演示同步比对信息','measureSync','','primary')}${btn('记录差异（演示）','feedback','measure')}</div><span class="small">判断口径待确认；完成后可返回方案</span>`;case 3:return `<div class="row">${btn('不一致检查反馈（演示）','feedback','site','primary')}</div><span class="small">未确认项保持待确认；反馈方式待确认</span>`}}
function render(){
 const mobile=s.mode==='mobile',index=mobile?s.mobile:s.page;
 $('mode-pc').classList.toggle('active',!mobile);$('mode-mobile').classList.toggle('active',mobile);
 $('mode-pc').setAttribute('aria-pressed',String(!mobile));$('mode-mobile').setAttribute('aria-pressed',String(mobile));
 $('page-index').innerHTML=(mobile?MOBILE:PC).map((x,i)=>btn(`${mobile?(i<2?'P0':'P1 可选'):(String(i+1).padStart(2,'0'))} · ${x}`,mobile?'scene':'goto',i,index===i?'active':'')).join('');
 $('dimensions').textContent=mobile?'移动画布 · 402 × 874 px':'PC 画布 · 1440 × 810 px / 16:9';
 $('screen-label').hidden=!mobile;$('screen-label').textContent='移动端 · iPhone 17 画布尺寸 · 灰阶线框';
 const choices=[...SCENARIOS,...(mobile?MERR[s.mobile]:[PCERR[s.page]])];
 $('scenario').innerHTML=choices.map(([v,l])=>`<option value="${v}" ${s.scenario===v?'selected':''}>${l}${v==='default'||v==='ready'?'':'（演示）'}</option>`).join('');

function fit(){const mobile=s.mode==='mobile',w=mobile?402:1440,h=mobile?874:810;const available=Math.max(220,document.querySelector('.viewer').clientWidth-(window.innerWidth<600?16:40));const scale=Math.min(1,available/w);$('canvas').style.transform=`scale(${scale})`;$('canvas-wrap').style.width=(w*scale)+'px';$('canvas-wrap').style.height=(h*scale)+'px'}
function completeDemo(){
 s.upload='上传完成';s.filename='平面图占位（示意）';s.format='待确认';s.quality=true;s.scale='已设置（演示）';s.sizeDemo=true;s.scalePosition=true;s.scaleChecked=true;s.region=true;s.wall=true;s.recognition='已确认（演示）';s.wallSelected=true;s.material=true;s.thickness=true;s.wallChecked=true;

 case 'sizeDemo':s.sizeDemo=true;s.size='待确认（占位演示）';toast('已使用待确认占位；没有补充真实长度或单位。');break;
 case 'scaleSet':if(!s.scalePosition||(!s.size.trim()&&!s.sizeDemo)){s.scale='待补充尺寸';toast('请指定图纸对应位置，并补充可核实的实际尺寸；也可明确使用待确认占位演示。');break}s.scale='已设置（演示）';toast('已演示比例尺设置；未计算真实比例尺，请检查结果。');break;
 case 'drawRegion':s.region=true;toast('已展示手动区域标注示意；没有自动识别房间。');break;
 case 'drawWall':s.wall=true;s.wallSelected=true;toast('已展示手动墙体标注示意，请检查并选择墙体信息。');break;

 case 'selectWall':if(s.mode==='mobile'||s.page!==2){toast('墙体为查看示意；需要修正请回到 PC 区域与墙体页面。');return}s.wall=true;s.wallSelected=true;toast('已选中示意墙体，侧栏显示材质和厚度占位选项。');break;

 case 'manualAP':if(!s.scaleChecked||!s.wallChecked){toast('请先演示确认比例尺与墙体信息；或使用外层完整示意查看后续页面。');return}s.placing=true;s.apState='待确认点位';toast('点击图纸放置示意 AP。点位与数量不代表实际设计。');break;
 case 'recommend':if(!s.scaleChecked||!s.wallChecked){toast('请先补充比例尺和墙体确认信息；可返回对应步骤。');return}s.placing=false;s.apState='推荐中';toast('自动推荐中（演示），没有执行布点算法。');break;
 case 'recommendComplete':s.points=samplePoints();s.selected='A';s.apState='待确认点位';toast('已呈现推荐点位占位示意；请先逐项确认点位。');break;
 case 'selectAP':s.selected=value;toast('已定位示意点位 '+value+' 与对应信息；型号和数量待确认。');break;
 case 'confirmPoint':{let p=s.points.find(x=>x.id===value);if(!p)return;p.pos=true;s.selected=value;s.apState=s.points.every(x=>x.pos)?'待确认型号与数量':'待确认点位';toast('点位 '+value+' 已演示确认。请确认全部点位后再确认型号与数量。');break}
 case 'confirmModel':{if(!s.points.every(p=>p.pos)){toast('请先逐项确认全部示意点位，再确认对应型号与数量。');return}const p=s.points.find(p=>p.id===value);if(!p)return;p.model=true;s.apState=apReady()?'已确认（演示）':'待确认型号与数量';toast('已演示确认点位 '+value+' 对应型号与数量；真实值仍待确认。');break}

document.addEventListener('click',e=>{
 const svg=e.target.closest('svg[data-map="yes"]');
 if(svg&&s.mode==='pc'&&s.page===3&&(s.placing||s.adjusting)){
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const local=p.matrixTransform(svg.getScreenCTM().inverse());
  if(local.x<75||local.x>730||local.y<60||local.y>400){toast('请在示意图纸范围内点击；该范围仅为绘图边界，不是业务规则。');return}
  if(s.adjusting){const ap=s.points.find(p=>p.id===s.adjusting);if(ap){ap.x=local.x;ap.y=local.y}s.adjusting='';toast('已调整示意点位，请重新检查对应信息与覆盖。')}
  else{const id=String.fromCharCode(65+s.points.length);s.points.push({id,x:local.x,y:local.y,pos:false,model:false});s.selected=id;s.placing=false;toast('已手动放置示意点位 '+id+'，请检查确认。')}
  render();return;
 }
 const control=e.target.closest('[data-action]');
 if(control){e.stopPropagation();handle(control.dataset.action,control.dataset.value||'')}
});
document.addEventListener('keydown',e=>{const el=e.target.closest('svg [data-action]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();handle(el.dataset.action,el.dataset.value||'')}});

  if(v&&id==='quality'&&s.upload!=='上传完成'){toast('请先展示上传完成和预览。');render();return}

  if(id.startsWith('review'))s.review[Number(id.slice(6))]=v;else s[id]=v;

 }
 if(t.id==='local-file'&&t.files[0]){const f=t.files[0],mobile=t.dataset.target==='mobile',isImage=f.type.startsWith('image/');const url=isImage?URL.createObjectURL(f):'';if(mobile){if(s.photoImage)URL.revokeObjectURL(s.photoImage);s.photoImage=url;s.photoName=f.name;s.photoSelected=true;s.photoChecked=false;s.photo='待上传'}else{if(s.image)URL.revokeObjectURL(s.image);s.image=url;s.filename=f.name;s.format=f.type||'待确认';s.upload='待上传';s.quality=false}render();toast(isImage?'文件仅用于本地预览，不上传服务器。具体业务支持格式待确认。':'已读取文件名称；不解析此文件。CAD 和其他格式支持规则待确认。')}
});
